# Example: socket doctor as the pull-request gate.
#
# The smallest fleet-shaped gate: one job, the fleet block up front, then
# policy. doctor exits 1 when a practice breaks (soak-time missing, a bare
# install anywhere, no Socket in CI), so the check fails the PR before the
# practices drift.
name: doctor-gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      # ── setup-and-install (the fleet block) ──────────────────────────
      # Fleet form: uses: ./.github/actions/fleet/setup-and-install
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (2026-05-15)

      - name: Install
        run: sfw pnpm install --frozen-lockfile
      # ── end setup-and-install ─────────────────────────────────────────

      - name: Enforce the practices
        run: socket doctor
