name: 'ci: e2e'
run-name: 'ci: e2e'

# Tier 3 end-to-end tests. Hit real LLM APIs (Claude, Codex, Gemini)
# and the Socket production API.
#
# Trigger model:
#   - pull_request / push to main → run against `codex` only.
#     Keeps PR cost bounded; the other agents run on demand.
#   - workflow_dispatch              → run against the chosen agent
#     (default `codex`, or `all` for the full matrix).
#
# Each agent runs only when its repository credential is available.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_agent:
        description: 'Agent to use for E2E tests'
        type: choice
        options:
          - claude-code
          - codex
          - gemini
          - all
        default: codex

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
  DISABLE_TELEMETRY: '1'
  DO_NOT_TRACK: '1'
  NO_UPDATE_NOTIFIER: '1'
  OTEL_SDK_DISABLED: 'true'

jobs:
  e2e:
    name: E2e (${{ matrix.agent }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # On dispatch, honor the input (with `all` fanning out to the
        # full set). On push/PR, scope to `codex` only — the
        # full matrix is a deliberate dispatch-only escape hatch.
        agent: ${{ fromJson( github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.test_agent == 'all' &&
          '["claude-code","codex","gemini"]' || format('["{0}"]',
          github.event.inputs.test_agent)) || '["codex"]' ) }}
    steps:
      - name: Check agent credential
        id: agent-credential
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TEST_AGENT: ${{ matrix.agent }}
        run: |
          case "$TEST_AGENT" in
            claude-code) credential='' ;;
            codex) credential="$OPENAI_API_KEY" ;;
            gemini) credential="$GOOGLE_API_KEY" ;;
            *) echo "Unknown agent: $TEST_AGENT" >&2; exit 2 ;;
          esac
          if [ -n "$credential" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.agent-credential.outputs.available == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.agent-credential.outputs.available == 'true'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm
        if: steps.agent-credential.outputs.available == 'true'
        working-directory: ${{ runner.temp }}
        run: npm install --global --allow-scripts=pnpm pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
        if: steps.agent-credential.outputs.available == 'true'

      - name: Run e2e tests (tier 3)
        if: steps.agent-credential.outputs.available == 'true'
        env:
          RUN_E2E: '1'
          TEST_AGENT: ${{ matrix.agent }}
          SOCKET_API_TOKEN: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          case "$TEST_AGENT" in
            claude-code) agent_package='@anthropic-ai/claude-code@2.1.198' ;;
            codex) agent_package='@openai/codex@0.144.5' ;;
            gemini) agent_package='@google/gemini-cli@0.51.0' ;;
            *) echo "Unknown agent: $TEST_AGENT" >&2; exit 2 ;;
          esac
          pnpm --package="$agent_package" dlx sh -c 'pnpm run test:e2e'
