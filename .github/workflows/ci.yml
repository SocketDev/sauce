name: ⚡ CI

# Dependencies:
#   - SocketDev/socket-registry/.github/workflows/ci.yml

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Run CI Pipeline
    uses: SocketDev/socket-registry/.github/workflows/ci.yml@30c9d1e8ee7d2f9997eb0d6150c4baca23a776d4 # main
    with:
      # Tier 1 = structural tests (cheap, no API keys needed). Tier 2
      # (api) and Tier 3 (e2e) are not part of CI on every PR — Tier 2
      # needs SOCKET_API_TOKEN, Tier 3 needs LLM API keys. They run on
      # explicit dispatch via `.github/workflows/e2e.yml`.
      #
      # The `test-setup-script` runs before vitest and verifies that
      # the auto-generated artifacts (agents/AGENTS.md, marketplace
      # JSON, plugin JSON, etc.) are byte-fresh. If a contributor
      # edited a SKILL.md but forgot to re-run `pnpm run generate`,
      # this fails the PR.
      test-setup-script: 'pnpm run generate:check'
      test-script: 'pnpm exec vitest run --config tests/vitest.config.ts tier1-structural/'
