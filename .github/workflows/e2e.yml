name: 🧪 E2e
run-name: E2e

# Tier 3 end-to-end tests. Hit real LLM APIs (Claude, Codex, Gemini)
# and the Socket production API.
#
# Trigger model:
#   - pull_request / push to main → run against `codex` only.
#     Keeps PR cost bounded; the other agents run on demand.
#   - workflow_dispatch              → run against the chosen agent
#     (default `codex`, or `all` for the full matrix).
#
# Each agent runs only when its repository credential is available.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_agent:
        description: 'Agent to use for E2E tests'
        type: choice
        options:
          - claude-code
          - codex
          - gemini
          - all
        default: codex

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2e (${{ matrix.agent }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # On dispatch, honor the input (with `all` fanning out to the
        # full set). On push/PR, scope to `codex` only — the
        # full matrix is a deliberate dispatch-only escape hatch.
        agent: ${{ fromJson( github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.test_agent == 'all' &&
          '["claude-code","codex","gemini"]' || format('["{0}"]',
          github.event.inputs.test_agent)) || '["codex"]' ) }}
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          TRIGGER_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          FETCH_ARGS=(--no-tags --prune --depth 1 origin "${TRIGGER_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" fetch "${FETCH_ARGS[@]}"
          else
            git fetch "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD
      - name: Check agent credential
        id: agent-credential
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TEST_AGENT: ${{ matrix.agent }}
        run: |
          case "$TEST_AGENT" in
            claude-code) credential='' ;;
            codex) credential="$OPENAI_API_KEY" ;;
            gemini) credential="$GOOGLE_API_KEY" ;;
            *) echo "Unknown agent: $TEST_AGENT" >&2; exit 2 ;;
          esac
          if [ -n "$credential" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up and install
        if: steps.agent-credential.outputs.available == 'true'
        uses: ./.github/actions/fleet/setup-and-install
        with:
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          # Thin-distribution CI auth: mint a contents:read-only token so the
          # bootstrap fetch (fired by `prepare` during install) can download the
          # fleet release bundle from the private wheelhouse.
          payload-token-client-id: ${{ secrets.SOCKET_PR_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_PR_APP_PRIVATE_KEY }}

      - name: Run e2e tests (tier 3)
        if: steps.agent-credential.outputs.available == 'true'
        env:
          RUN_E2E: '1'
          TEST_AGENT: ${{ matrix.agent }}
          SOCKET_API_TOKEN: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          case "$TEST_AGENT" in
            claude-code) agent_package='@anthropic-ai/claude-code@2.1.198' ;;
            codex) agent_package='@openai/codex@0.144.5' ;;
            gemini) agent_package='@google/gemini-cli@0.51.0' ;;
            *) echo "Unknown agent: $TEST_AGENT" >&2; exit 2 ;;
          esac
          pnpm --package="$agent_package" dlx sh -c 'pnpm run test:e2e'
