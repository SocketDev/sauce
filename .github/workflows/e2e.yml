name: 🧪 E2E

# Tier 3 end-to-end tests. Hit real LLM APIs (Claude, Codex, Gemini)
# and the Socket production API.
#
# Trigger model:
#   - pull_request / push to main → run against `claude-code` only.
#     Keeps PR cost bounded; the other agents run on demand.
#   - workflow_dispatch              → run against the chosen agent
#     (default `claude-code`, or `all` for the full matrix).
#
# PR runs use repo-scoped secrets; fork PRs don't get them and the
# job will fail-fast with a missing-secret error rather than running
# without auth.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_agent:
        description: 'Agent to use for E2E tests'
        type: choice
        options:
          - claude-code
          - codex
          - gemini
          - all
        default: claude-code

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (${{ matrix.agent }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # On dispatch, honor the input (with `all` fanning out to the
        # full set). On push/PR, scope to `claude-code` only — the
        # full matrix is a deliberate dispatch-only escape hatch.
        agent: ${{ fromJson(
          github.event_name == 'workflow_dispatch'
          && (github.event.inputs.test_agent == 'all'
          && '["claude-code","codex","gemini"]'
          || format('["{0}"]', github.event.inputs.test_agent))
          || '["claude-code"]'
          ) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (2026-05-15)
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/fleet/setup-and-install
        with:
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          # Thin-distribution CI auth: mint a contents:read-only token so the
          # bootstrap fetch (fired by `prepare` during install) can download the
          # fleet release bundle from the private wheelhouse.
          payload-token-client-id: ${{ vars.SOCKET_PAYLOAD_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_PAYLOAD_APP_PRIVATE_KEY }}

      # zizmor: ignore[secrets-outside-env]
      - name: Run E2E tests (Tier 3)
        env:
          RUN_E2E: '1'
          TEST_AGENT: ${{ matrix.agent }}
          SOCKET_API_TOKEN: ${{ secrets.SOCKET_API_TOKEN || secrets.SOCKET_SECURITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          case "$TEST_AGENT" in
            claude-code) agent_package='@anthropic-ai/claude-code@2.1.198' ;;
            codex) agent_package='@openai/codex@0.144.5' ;;
            gemini) agent_package='@google/gemini-cli@0.51.0' ;;
            *) echo "Unknown agent: $TEST_AGENT" >&2; exit 2 ;;
          esac
          pnpm --package="$agent_package" dlx sh -c 'pnpm run test:e2e'
