# Managed by socket-release-kit — byte-identical to
# scripts/socket-release/templates/workflows/brew-publish.yml. Bumps the
# Homebrew tap formula for a PUBLISHED release: the sha256 authority is the
# release's own checksums.txt (never re-hashed), and the tap commit is a
# GitHub-signed API commit direct to the tap default branch — never a PR.
# The write token is minted per-run by the co-located
# socket-release-app-token composite from the org-wide App credentials.
name: brew publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to bump the formula to (vX.Y.Z).'
        type: string
        required: true
      publish:
        description: 'Commit the bump for real (false = dry-run, the default).'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: brew-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # A real bump (release event, or dispatch with publish) runs gated by the
    # brew-publish environment; a dry-run is ungated. Expression in
    # `environment:` is lawful — not a run body.
    environment: ${{ (github.event_name == 'release' || inputs.publish == true) && 'brew-publish' || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (2026-05-15)
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (2026-03-11)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (2026-05-15)
        with:
          node-version: '24'
      - name: Install
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
      - name: Mint tap write token
        id: app-token
        uses: ./.github/actions/socket-release-app-token
        with:
          client-id: ${{ vars.SOCKET_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOCKET_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Bump formula
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUBLISH: ${{ inputs.publish }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          ARGS=(--tag "$TAG")
          if [ "$PUBLISH" = "true" ] || [ "$GITHUB_EVENT_NAME" = "release" ]; then ARGS+=(--apply); fi
          node scripts/socket-release/brew-publish.mts "${ARGS[@]}"
