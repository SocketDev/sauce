# Managed by socket-release-kit — byte-identical to
# scripts/socket-release/templates/workflows/npm-publish.yml (the bootstrap's
# staged-config step restores drift; reconcile edits into the template).
#
# ENVIRONMENT PIN: the job pins `environment: npm-publish` because npm's
# trusted-publisher OIDC exchange 404s outside the exact environment the
# trust config names — a publish run from any other environment cannot mint
# a token at all.
#
# ORDER RULE: registry publish FIRST; the git tag + immutable GitHub release
# follow only once the version resolves as live (github-release.yml gates on
# registry liveness — the release is the FINAL marker, never the first).
name: npm publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish for real (false = dry-run, the default).'
        type: boolean
        default: false
      dist-tag:
        description: 'npm dist-tag for the staged publish.'
        type: string
        default: latest
      backfill-version:
        description: 'Backfill an already-tagged version (X.Y.Z), else empty.'
        type: string
        default: ''
      checkout-ref:
        description: 'Ref to check out for a backfill, else empty.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (2026-05-15)
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
      # Reads the consumer's `packageManager` pin — the bootstrap preflight
      # requires it, so CI publishes with the same pnpm the operator staged
      # with.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (2026-03-11)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (2026-05-15)
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
      - name: Build
        run: |
          set -euo pipefail
          pnpm run build
      - name: Stage publish
        env:
          BACKFILL: ${{ inputs.backfill-version }}
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
          DIST_TAG: ${{ inputs.dist-tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          ARGS=(--staged --tag "$DIST_TAG")
          if [ -n "$BACKFILL" ]; then ARGS+=(--backfill "$BACKFILL" --checkout-ref "$CHECKOUT_REF"); fi
          if [ "$PUBLISH" != "true" ]; then ARGS+=(--dry-run); fi
          node scripts/socket-release/npm-publish.mts "${ARGS[@]}"
