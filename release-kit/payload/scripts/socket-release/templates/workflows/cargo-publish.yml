# Managed by socket-release-kit — byte-identical to
# scripts/socket-release/templates/workflows/cargo-publish.yml. Adapted from
# the fleet preset: manual dispatch, DRY-RUN unless `publish: true`;
# publishes via crates.io Trusted Publishing (OIDC — id-token: write, no
# long-lived token). The `cargo-publish` CI environment gates the real,
# PERMANENT publish (crates.io is yank-only).
#
# ORDER RULE: the engine publishes FIRST, then gates the git tag + immutable
# GH release on the version being resolvable in the crates.io index — the
# release is the FINAL marker and never precedes the registry publish.
name: cargo publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish for real (false = dry-run, the default).'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cargo-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Same-named CI environment: the human-approval + OIDC gate for the
    # PERMANENT publish; a dry-run is ungated. An expression in
    # `environment:` is lawful — it is not a run body.
    environment: ${{ inputs.publish == true && 'cargo-publish' || '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (2026-05-15)
        with:
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (2026-03-11)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (2026-05-15)
        with:
          node-version: '24'
      - name: Install
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly (2025-01-27)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1 (2025-07-29)
      - name: crates.io auth (OIDC Trusted Publishing)
        id: auth
        if: ${{ inputs.publish == true }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.2 (2025-06-06)
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          ARGS=(--staged --dry-run)
          if [ "$PUBLISH" = "true" ]; then ARGS=(--direct); fi
          node scripts/socket-release/cargo-publish.mts "${ARGS[@]}"
      - name: Attest build provenance (.crate)
        if: ${{ inputs.publish == true }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0 (2025-06-04)
        with:
          subject-path: target/package/*.crate
