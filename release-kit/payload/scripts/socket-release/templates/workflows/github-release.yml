# Managed by socket-release-kit — byte-identical to
# scripts/socket-release/templates/workflows/github-release.yml.
#
# ORDER RULE: the immutable GitHub release is the FINAL marker of a release.
# The `gate` job refuses any tag whose version is not already resolvable on
# its registry (registry-liveness-gate runs on the runner's system Node,
# before any install exists); `ensure-release` heals a tag gap manually.
name: github release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to gate/heal (vX.Y.Z), else the pushed tag.'
        type: string
        default: ''
      release:
        description: 'Cut the release for real (workflow_dispatch only).'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (2026-05-15)
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Registry liveness gate
        env:
          TAG: ${{ github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          node scripts/socket-release/registry-liveness-gate.mjs
  ensure-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (2026-05-15)
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (2026-03-11)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (2026-05-15)
        with:
          node-version: '24'
      - name: Install
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
      - name: Build
        run: |
          set -euo pipefail
          pnpm run build
      - name: Ensure tag + immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/socket-release/github-release.mts --tag "$TAG" --release
